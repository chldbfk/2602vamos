name: Deploy vamos to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'vamos/**'
      - '.github/workflows/deploy-vamos.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-vamos
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vamos/package-lock.json

      - name: Install dependencies
        working-directory: vamos
        run: npm ci

      - name: Type-check and lint
        working-directory: vamos
        run: npm run lint

      - name: Build
        working-directory: vamos
        run: npm run build

      # Pushes vamos/dist as the whole content of gh-pages, using the token GitHub Actions
      # provides automatically — no manual secret to set up.
      - name: Deploy to gh-pages
        working-directory: vamos/dist
        run: |
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
